name: Build macOS preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and verify
        run: |
          zsh -n build.sh
          zsh -n package.sh
          plutil -lint Info.plist
          zsh build.sh
          codesign --verify --strict --verbose=2 build/LidGlass.app
      - name: Package preview
        run: |
          zsh package.sh
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          hdiutil verify LidGlass-*-arm64-preview.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LidGlass-arm64-preview
          path: dist/*
          if-no-files-found: error
